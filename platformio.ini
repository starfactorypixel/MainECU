[platformio]
extra_configs = platformio_local.ini

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.extra_flags = 
	-D BOARD_HAS_PSRAM

lib_deps = 
	https://github.com/starfactorypixel/Library_CUtils.git
	https://github.com/starfactorypixel/PixelLoggerLibrary.git
	https://github.com/starfactorypixel/Library_DrakePin.git
	https://github.com/starfactorypixel/Library_DrakeScript.git
	https://github.com/starfactorypixel/Library_PixelSPI.git
monitor_speed = 500000
upload_speed = 921600
debug_tool = esp-builtin
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	${local.build_flags}

; значения по умолчанию, переопределяются в platformio_local.ini
[local]
build_flags = 

[env:Debug]
build_type = debug
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG

[env:Release]
build_type = release
build_unflags = 
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
