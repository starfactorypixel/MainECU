name: CodeQL

on:
  push:
    branches: [ "board_v*" ]
  pull_request:
    branches: [ "board_v*" ]
  schedule:
    - cron: '25 15 * * 6'

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # Cppcheck запускается до CodeQL, чтобы не попасть под его трассировку сборки
      - name: Cppcheck
        continue-on-error: true
        run: pio check -e Debug --flags "cppcheck: --xml --output-file=report.xml --enable=all"

      - name: Convert Cppcheck report to SARIF
        uses: Flast/cppcheck-sarif@v2
        with:
          input: report.xml
          output: report.sarif

      - name: Upload Cppcheck results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif
          category: cppcheck

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build PlatformIO Project
        run: pio run -e Debug

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
